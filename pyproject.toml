[project]
name = "nano-mle"
version = "0.1.0"
description = "A sequential DSPy harness for exploration and Skrub pipeline search"
readme = "README.md"
authors = [
    { name = "Elias Strauss", email = "elias.strauss@tu-berlin.de" }
]
requires-python = ">=3.14"
dependencies = [
    "dspy>=3.4.0",
    "gcsfs>=2026.10.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "skrub>=0.11.0",
]

[project.scripts]
nano-mle = "nano_mle:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
